name: CI
on:
  push:
    branches: [ main, 'feature/**', 'work/**', 'ci-demo' ]
  pull_request:
    branches: [ main ]
jobs:
  quality:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
      - name: Установити .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Відновити залежності
        run: dotnet restore OnlineCourses.slnx
      - name: Перевірка форматування
        run: dotnet format OnlineCourses.slnx --verify-no-changes --no-restore
      - name: Складання Release з аналізаторами
        run: dotnet build OnlineCourses.slnx -c Release --no-restore -warnaserror
      - name: Тести Legacy
        run: dotnet test tests/Legacy.Tests/OnlineCourses.Legacy.Tests.csproj -c Release --no-build
      - name: Тести й покриття
        run: >
          dotnet test tests/OnlineCourses.Tests.Current/OnlineCourses.Tests.csproj
          -c Release --no-build
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:Threshold=70 "/p:ThresholdType=line%2cbranch"
          "/p:Include=[OnlineCourses.Core]OnlineCourses.Core.Pricing.CourseDiscountPolicy%2c[OnlineCourses.Core]OnlineCourses.Core.Services.RegistrationService%2c[OnlineCourses.Core]OnlineCourses.Core.Domain.Registration%2c[OnlineCourses.Core]OnlineCourses.Core.Domain.RegistrationItem%2c[OnlineCourses.Core]OnlineCourses.Core.Domain.Course%2c[OnlineCourses.Core]OnlineCourses.Core.Domain.CourseGroup%2c[OnlineCourses.Core]OnlineCourses.Core.Domain.Enrollment%2c[OnlineCourses.Core]OnlineCourses.Core.Services.EnrollmentService%2c[OnlineCourses.Core]OnlineCourses.Core.Services.InMemoryEnrollmentRepository%2c[OnlineCourses.Core]OnlineCourses.Core.Pricing.CoursePackagePricingPolicy"
      - name: Створити тег v1.0 після успішної перевірки main
        if: github.ref == 'refs/heads/main' && success() && contains(github.event.head_commit.message, 'release-v1.0')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -fa v1.0 "$GITHUB_SHA" -m "SR03 variant 17 final"
          git push --force origin refs/tags/v1.0
      - name: Зберегти звіт про покриття
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '**/coverage.cobertura.xml'